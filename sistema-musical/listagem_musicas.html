<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Musical — Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100
100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <!-- Cabeçalho da página -->
        <div class="topbar">
            <a href="index.html" class="btn-back">⬅️ Voltar</a>
        </div>

        <div class="page-header-bar">
            <h2>🎼 Biblioteca Musical</h2>
            <div class="header-actions">

                <a href="index.html" class="btn-back">⬅ Voltar ao Menu</a>
                <a href="cadastro_musica.html" class="btn-primary">➕ Nova Música</a>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="filters">
            <form method="get" class="filter-form" action="#">

                <div class="filter-group">

                    <div class="filter-item">
                        <label for="busca">Busca Geral:</label>
                        <input type="text" id="busca" name="busca" placeholder="Título, álbum, artista...">
                    </div>

                    <div class="filter-item">
                        <label for="artista">Artista:</label>

                        <select id="artista" name="artista">
                            <option value="">Todos os artistas</option>
                            <option value="artista1">Djvan</option>
                            <option value="artista2">Marisa Monte</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="genero">Gênero:</label>
                        <select id="genero" name="genero">
                            <option value="">Todos os gêneros</option>
                            <option value="mpb">MPB</option>
                        </select>
                    </div>

                    <!-- Filters action area do botão de filtrar -->
                     <div class="filter-actions">
                        <button type="submit" class="btn-primary">🔎 Filtrar</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- ============= Tabela de músicas ===============-->
        <div class="music-table">
            <table>
                <thead>
                    <tr>
                        <th class="col-capa">Capa</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Gênero</th>
                        <th class="col-youtube">YouTube</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>


                <tbody>
                    <!-- Exemplo de linha de música -->
                    <tr>
                        <td><div class="no-image">Sem<br>capa</div></td>
                        <td>Oceano</td>
                        <td>Djavan</td>
                        <td>Luz</td>
                        <td>MPB</td>
                        <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td></td>>
                        <td>
                            <div class="actions-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">️🗑️</a>
                            </div>
                        </td>
                    </tr>

                    <!-- Outra linha de música -->
                    <tr>
                        <td><div class="no-image">Sem<br>capa</div></td>
                        <td>Infinito Particular</td>
                        <td>Marisa Monte</td>
                        <td>—</td>
                        <td>MPB</td>
                        <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">️🗑️</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>         
</body>
</html>
